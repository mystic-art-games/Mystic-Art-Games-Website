<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helianthe — Mobile Preview</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px 12px; background: #e8e9e1; color: #173f32; }
    main { width: max-content; max-width: 100%; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 20px; text-align: center; }
    p { margin: 0 0 16px; font-size: 13px; text-align: center; }
    .phone { width: 406px; max-width: 100%; height: 860px; padding: 8px; overflow: hidden; border-radius: 30px; background: #173f32; box-shadow: 0 16px 40px #102b2160; }
    iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 22px; background: #f8f7ef; }
  </style>
</head>
<body>
  <main>
    <h1>Helianthe mobile preview</h1>
    <p>390 × 844 px · Live local site</p>
    <div class="phone">
      <iframe src="./" title="Helianthe at phone width"></iframe>
    </div>
  </main>
</body>
</html>
