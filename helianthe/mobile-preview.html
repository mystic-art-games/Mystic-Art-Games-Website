<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helianthe — Mobile Preview</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 12px; background: #e8e9e1; color: #173f32; }
    main { width: max-content; max-width: 100%; margin: 0 auto; }
    .phone { width: min(418px, calc((100dvh - 56px) * 418 / 872)); max-width: 100%; height: auto; aspect-ratio: 418 / 872; padding: 8px; overflow: hidden; border-radius: 30px; background: #173f32; box-shadow: 0 16px 40px #102b2160; }
    iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 22px; background: #f8f7ef; }
    .dimensions { margin: 8px 0 0; font-size: 12px; line-height: 16px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="phone">
      <iframe src="./" title="Helianthe at phone width"></iframe>
    </div>
    <p class="dimensions" id="dimensions" aria-live="off"></p>
  </main>
  <script>
    const phone = document.querySelector('.phone');
    const screen = phone.querySelector('iframe');
    const dimensions = document.querySelector('#dimensions');
    const tabs = new Set(['cards', 'decks', 'profiles', 'patrons', 'about']);
    const getTabHash = hash => tabs.has(hash.slice(1).toLowerCase()) ? `#${hash.slice(1).toLowerCase()}` : '';
    const initialHash = getTabHash(window.location.hash);
    if (initialHash) screen.src = `./${initialHash}`;
    screen.addEventListener('load', () => {
      const iframeHash = getTabHash(screen.contentWindow.location.hash);
      if (iframeHash && window.location.hash !== iframeHash) window.history.replaceState(null, '', iframeHash);
    });
    window.addEventListener('hashchange', () => {
      const nextHash = getTabHash(window.location.hash);
      if (nextHash && screen.contentWindow.location.hash !== nextHash) screen.contentWindow.location.hash = nextHash;
    });
    const updateDimensions = () => {
      const frameWidth = Math.round(phone.getBoundingClientRect().width);
      const frameHeight = Math.round(phone.getBoundingClientRect().height);
      const screenWidth = Math.round(screen.getBoundingClientRect().width);
      const screenHeight = Math.round(screen.getBoundingClientRect().height);
      dimensions.textContent = `Preview: ${frameWidth} × ${frameHeight} CSS px · Screen: ${screenWidth} × ${screenHeight} CSS px`;
    };
    new ResizeObserver(updateDimensions).observe(phone);
    updateDimensions();
  </script>
</body>
</html>
