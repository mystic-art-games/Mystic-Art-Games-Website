<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helianthe — Mobile Preview</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 12px; background: #e8e9e1; color: #173f32; }
    main { width: max-content; max-width: 100%; margin: 0 auto; }
    .phone { width: min(418px, calc((100vh - 24px) * 418 / 890)); max-width: 100%; height: auto; aspect-ratio: 418 / 890; padding: 8px; overflow: hidden; border-radius: 30px; background: #173f32; box-shadow: 0 16px 40px #102b2160; }
    iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 22px; background: #f8f7ef; }
  </style>
</head>
<body>
  <main>
    <div class="phone">
      <iframe src="./" title="Helianthe at phone width"></iframe>
    </div>
  </main>
</body>
</html>
